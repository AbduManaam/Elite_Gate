#Infrastructure configuration file
#Infrastructure configuration file

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: elitegate_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 9539Abdu
      POSTGRES_DB: elitegate_db
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d elitegate_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - elitegate_net

  redis:
    image: redis:7-alpine
    container_name: elitegate_redis
    command: redis-server --requirepass redis_secret
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "redis_secret", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - elitegate_net

  gateway:
    build:
      context: ..
      dockerfile: deploy/docker/gateway.Dockerfile
    container_name: elitegate_gateway
    ports:
      - "8080:8080"
      - "50051:50051"
    env_file:
      - ../.env
    volumes:
      # Persist gateway logs on host machine
      - ../logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped
    networks:
      - elitegate_net

  admin:
    build:
      context: ..
      dockerfile: deploy/docker/admin.Dockerfile
    container_name: elitegate_admin
    ports:
      - "9090:9090"
    env_file:
      - ../.env
    volumes:
      - ../logs:/app/logs
      - type: npipe
        source: \\.\pipe\docker_engine
        target: //./pipe/docker_engine
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - elitegate_net

  prometheus:
    image: prom/prometheus:latest
    container_name: elitegate_prometheus

    ports:
      - "9091:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    networks:
      - elitegate_net

  grafana:
    image: grafana/grafana:latest
    container_name: elitegate_grafana

    ports:
      - "3001:3000"

    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

    networks:
      - elitegate_net

volumes:
  pg_data:

networks:
  elitegate_net:
    name: elitegate_net
    driver: bridge
