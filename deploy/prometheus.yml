global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "elitegate-gateway"
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: "elitegate-admin"
    static_configs:
      - targets: ["admin:9090"]

  - job_name: "elitegate-gateway-dedicated"
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      - source_labels: [__meta_docker_container_label_elitegate_gateway_id]
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: '/?(.*)'
        target_label: job
        replacement: '$1'
      - source_labels: [__meta_docker_container_name]
        regex: '/?(.*)'
        target_label: instance
        replacement: '$1'
      - source_labels: [__meta_docker_port_private]
        regex: "8080"
        action: keep

