server:
  port: ":8080"
  gateway_port: ":8080"
  admin_port: ":9090"
  admin_api_url: "http://admin:9090"
  read_timeout: "15s"
  write_timeout: "30s"
  idle_timeout: "60s"
  shutdown_timeout: "30s"
  drain_timeout: "5s"
  drain_stale_after: "2m"
  grpc_gateway_port: ":50051"
  route_reload_interval: "10s"
  prometheus_url: "http://prometheus:9090"
  metrics_cache_ttl: "30s"
  allowed_origins:
    - http://localhost:5173

log:
  level: "debug"          # debug | info | warn | error
  file: "logs/gateway.log"
  max_size_mb: 50         # rotate after 50 MB
  max_backups: 7          # keep 7 old files
  max_age_days: 10        # delete files older than 10 days

database:
  max_open_conns: 25
  max_idle_conns: 5

redis:
  addr: "redis:6379"
  db: 0

rate_limit:
  requests_per_minute: 100
