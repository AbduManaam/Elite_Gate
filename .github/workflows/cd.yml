name: Backend CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      ECR_ADMIN_REPOSITORY: ${{ vars.ECR_ADMIN_REPOSITORY }}
      ECR_GATEWAY_REPOSITORY: ${{ vars.ECR_GATEWAY_REPOSITORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define image URIs
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            SOURCE_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SOURCE_SHA="${GITHUB_SHA}"
          fi

          IMAGE_TAG="${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "ADMIN_IMAGE=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_ADMIN_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "GATEWAY_IMAGE=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_GATEWAY_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Build Admin image
        run: |
          docker build \
            --file deploy/docker/admin.Dockerfile \
            --tag "$ADMIN_IMAGE" \
            .

      - name: Build Gateway image
        run: |
          docker build \
            --file deploy/docker/gateway.Dockerfile \
            --tag "$GATEWAY_IMAGE" \
            .

      - name: Push images
        run: |
          docker push "$ADMIN_IMAGE"
          docker push "$GATEWAY_IMAGE"

      - name: Deploy through AWS Systems Manager
        shell: bash
        run: |
          set -Eeuo pipefail

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy EliteGate ${SOURCE_SHA}" \
              --parameters "commands=[\"sudo /opt/elitegate/deploy.sh '$ADMIN_IMAGE' '$GATEWAY_IMAGE'\"]" \
              --query "Command.CommandId" \
              --output text
          )"

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          echo "SSM command ID: $COMMAND_ID"

      - name: Wait for deployment result
        shell: bash
        run: |
          set -Eeuo pipefail

          set +e
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"
          WAIT_EXIT_CODE=$?
          set -e

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --no-cli-pager

          if [[ "$WAIT_EXIT_CODE" -ne 0 ]]; then
            echo "Deployment failed or timed out."
            exit "$WAIT_EXIT_CODE"
          fi

      - name: Verify deployment status
        shell: bash
        run: |
          set -Eeuo pipefail

          STATUS="$(
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text
          )"

          echo "Deployment status: $STATUS"

          if [[ "$STATUS" != "Success" ]]; then
            exit 1
          fi