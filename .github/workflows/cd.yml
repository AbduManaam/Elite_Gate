name: Backend CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      ECR_ADMIN_REPOSITORY: ${{ vars.ECR_ADMIN_REPOSITORY }}
      ECR_GATEWAY_REPOSITORY: ${{ vars.ECR_GATEWAY_REPOSITORY }}
      ECR_WORKER_REPOSITORY: ${{ vars.ECR_WORKER_REPOSITORY || 'elitegate-worker' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define image URIs
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            SOURCE_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SOURCE_SHA="${GITHUB_SHA}"
          fi

          IMAGE_TAG="${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "ADMIN_IMAGE=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_ADMIN_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "GATEWAY_IMAGE=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_GATEWAY_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_WORKER_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Build Admin image
        run: |
          docker build \
            --file deploy/docker/admin.Dockerfile \
            --tag "$ADMIN_IMAGE" \
            .

      - name: Build Gateway image
        run: |
          docker build \
            --file deploy/docker/gateway.Dockerfile \
            --tag "$GATEWAY_IMAGE" \
            .

      - name: Build Worker image
        run: |
          docker build \
            --file deploy/docker/worker.Dockerfile \
            --tag "$WORKER_IMAGE" \
            .

      - name: Push images
        run: |
          docker push "$ADMIN_IMAGE"
          docker push "$GATEWAY_IMAGE"
          docker push "$WORKER_IMAGE"

      - name: Deploy through AWS Systems Manager
        shell: bash
        run: |
          set -Eeuo pipefail

          # Encode the latest deployment script checked out from this commit.
          DEPLOY_SCRIPT_BASE64="$(
            base64 --wrap=0 deploy/scripts/deploy-production.sh
          )"

          # Build the SSM command parameters safely as JSON.
          PARAMETERS="$(
            jq -n \
              --arg script "$DEPLOY_SCRIPT_BASE64" \
              --arg admin_image "$ADMIN_IMAGE" \
              --arg gateway_image "$GATEWAY_IMAGE" \
              --arg worker_image "$WORKER_IMAGE" \
              '{
                commands: [
                  "sudo mkdir -p /opt/elitegate",
                  (
                    "printf %s " +
                    ($script | @sh) +
                    " | base64 --decode | sudo tee /opt/elitegate/deploy.sh >/dev/null"
                  ),
                  "sudo chmod 750 /opt/elitegate/deploy.sh",
                  "echo \"Deployment script installed from current Git commit.\"",
                  "sudo grep -n \"PASSWORD_RESET_URL\" /opt/elitegate/deploy.sh || true",
                  (
                    "sudo /opt/elitegate/deploy.sh " +
                    ($admin_image | @sh) +
                    " " +
                    ($gateway_image | @sh) +
                    " " +
                    ($worker_image | @sh)
                  )
                ]
              }'
          )"

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy EliteGate ${SOURCE_SHA}" \
              --parameters "$PARAMETERS" \
              --query "Command.CommandId" \
              --output text
          )"

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          echo "SSM command ID: $COMMAND_ID"

      - name: Wait for deployment result
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Waiting for deployment command $COMMAND_ID on instance $EC2_INSTANCE_ID..."

          MAX_ATTEMPTS=60
          SLEEP_SECONDS=10
          STATUS="InProgress"

          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            STATUS="$(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "Status" \
                --output text 2>/dev/null || echo "InProgress"
            )"

            if [[ "$STATUS" != "InProgress" && "$STATUS" != "Pending" ]]; then
              break
            fi

            echo "Attempt $i/$MAX_ATTEMPTS: Status is '$STATUS'. Waiting ${SLEEP_SECONDS}s..."
            sleep "$SLEEP_SECONDS"
          done

          echo "Final SSM Command Status: $STATUS"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --no-cli-pager

          if [[ "$STATUS" != "Success" ]]; then
            echo "Deployment failed or timed out with status: $STATUS"
            exit 1
          fi