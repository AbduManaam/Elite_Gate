name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repo-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run hygiene check
        run: ./scripts/check_repo_hygiene.sh --verbose

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: repo-hygiene

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elitegate_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d elitegate_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TEST_ADMIN_DATABASE_DSN: postgres://postgres:postgres@127.0.0.1:5433/elitegate_test?sslmode=disable
      TEST_APP_DATABASE_DSN: postgres://gate_app:gate_app_password@127.0.0.1:5433/elitegate_test?sslmode=disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/migrate

      - name: Run database migrations
        env:
          POSTGRES_DSN: ${{ env.TEST_ADMIN_DATABASE_DSN }}
        run: migrate -path migrations -database "$POSTGRES_DSN" up

      - name: Test
        run: go test ./... -race -count=1